name: Maintenance / Technical Task
description: Suggest maintenance, dependency, tooling, compatibility, or technical-debt work.
title: '[Maintenance]: '
body:
    - type: textarea
      id: task_description
      attributes:
          label: What needs to be done?
          description: Briefly describe the task and why it is useful. Implementation details are not required.
          placeholder: |
              What is the objective?
              If useful, mention affected components, dependencies, relevant versions, constraints, or how the work could be verified.
      validations:
          required: true
    - type: textarea
      id: additional_context
      attributes:
          label: Additional context or verification (optional)
          description: Add risks, scripts, compatibility details, or testing expectations if known. Design tokens come from c2b.config.json; do not edit generated token files by hand.
    - type: textarea
      id: acceptance_criteria
      attributes:
          label: Acceptance criteria
          description: These checks are prefilled for convenience. Adjust them to fit the task.
          value: |
              - [ ] The stated maintenance objective is complete.
              - [ ] Relevant tests, tooling, and compatibility checks pass.
              - [ ] Any material risks or regressions are addressed; generated files are regenerated from their source where applicable.
      validations:
          required: true
