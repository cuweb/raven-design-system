frozenLockfile: true
engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
approveBuildsFor: esbuild,@parcel/watcher

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

minimumReleaseAgeExclude:
  - '@troychaplin/component2block@0.6.0'
