frozenLockfile: true
engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

minimumReleaseAgeExclude:
  - '@troychaplin/component2block@0.6.0 || 0.9.0'
  - '@chromatic-com/storybook@5.5.0'
  - '@vitest/browser-playwright@5.0.4'
  - '@vitest/browser@5.0.4'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/pretty-format@5.0.4'
  - '@vitest/spy@5.0.4'
  - '@vitest/ui@5.0.4'
  - '@vitest/utils@5.0.4'
  - vitest@5.0.4
